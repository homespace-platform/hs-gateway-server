# ===============================================================
# CORE APPLICATION
# ===============================================================
server.port=8080
spring.application.name=gateway-server
spring.threads.virtual.enabled=true

# ===============================================================
# SERVICE URL
# ===============================================================
service.url.user=http://localhost:8081

# ===============================================================
# EUREKA SERVER
# ===============================================================
eureka.client.enabled=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ===============================================================
# SECURITY
# ===============================================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/realms/graduation-thesis/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9000/realms/graduation-thesis
security.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:5173

# ===============================================================
# OBSERVABILITY
# ===============================================================
## Actuator
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
## Logging
logging.level.root=INFO

# ===============================================================
# JACKSON
# ===============================================================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===============================================================
# REDIS RATE LIMITER
# ===============================================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=admin

# ===============================================================
# RESILIENCE4J CIRCUIT BREAKER
# ===============================================================
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.storageServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.productServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.blogServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.orderServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.auditServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.recommendationServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.configs.default.timeout-duration=6s
resilience4j.timelimiter.instances.storageServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.userServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.productServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.blogServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.orderServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.auditServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.recommendationServiceCircuitBreaker.base-config=default