# ===============================================================
# CORE APPLICATION
# ===============================================================
server.port=8080
spring.application.name=hs-gateway-server
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
spring.threads.virtual.enabled=true

# ===============================================================
# EUREKA SERVER
# ===============================================================
eureka.client.enabled=true
spring.cloud.discovery.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL}
eureka.instance.prefer-ip-address=true

# ===============================================================
# SECURITY
# ===============================================================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWK_SET_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================================================
# OBSERVABILITY
# ===============================================================
## Actuator
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
## Logging
logging.level.root=${LOGGING_LEVEL_ROOT}
logging.level.org.springframework.cloud.gateway.filter.ratelimit=${LOGGING_LEVEL_RATELIMIT}

# ===============================================================
# JACKSON
# ===============================================================
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===============================================================
# REDIS RATE LIMITER
# ===============================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
## Token bucket per resolved client IP.
## replenish-rate: so token duoc nap lai moi giay.
## burst-capacity: so request toi da co the don trong mot khoang ngan.
## requested-tokens: moi request tieu ton bao nhieu token.
gateway.rate-limiter.replenish-rate=${GATEWAY_RATE_LIMITER_REPLENISH_RATE:50}
gateway.rate-limiter.burst-capacity=${GATEWAY_RATE_LIMITER_BURST_CAPACITY:100}
gateway.rate-limiter.requested-tokens=${GATEWAY_RATE_LIMITER_REQUESTED_TOKENS:1}

# ===============================================================
# RESILIENCE4J CIRCUIT BREAKER
# ===============================================================
## Circuit Breaker: ngắt tạm thời việc gọi service khi service lỗi liên tục.
## Flow: CLOSED gọi bình thường -> OPEN trả fallback -> HALF_OPEN thử gọi lại.
## Hiện tại gateway chỉ có user-service; khi thêm service mới thì khai báo thêm instance bên dưới.
##
## Cửa sổ đánh giá: 20 request gần nhất, tối thiểu 5 request mới bắt đầu tính lỗi.
## Ngưỡng lỗi: lỗi từ 50% trở lên thì mở Circuit Breaker và trả fallback.
## Thử phục hồi: chờ 10 giây, sau đó cho tối đa 3 request test service.
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=20
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true
### Instances
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.coreServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.chatServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.newsServiceCircuitBreaker.base-config=default
resilience4j.circuitbreaker.instances.aiServiceCircuitBreaker.base-config=default
## Time Limiter: giới hạn thời gian chờ response từ service phía sau.
## Nếu quá 6 giây, request được xem là timeout và đi vào fallback.
resilience4j.timelimiter.configs.default.timeout-duration=6s
### Instances
resilience4j.timelimiter.instances.userServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.coreServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.chatServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.newsServiceCircuitBreaker.base-config=default
resilience4j.timelimiter.instances.aiServiceCircuitBreaker.timeout-duration=30s
